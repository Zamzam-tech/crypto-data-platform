name: Crypto Data Platform CI

on:
  push:
    branches:
      - master
      - main

  pull_request:
    branches:
      - master
      - main

jobs:
  python-validation:
    name: Validate Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check Python syntax
        run: |
          python -m compileall dags streaming

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: python-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Airflow image
        run: |
          docker build \
            -f Dockerfile.airflow \
            -t crypto-airflow:ci .

      - name: Build Producer image
        run: |
          docker build \
            -f Dockerfile.producer \
            -t crypto-producer:ci .

      - name: Build Spark image
        run: |
          docker build \
            -f Dockerfile.spark \
            -t crypto-spark:ci .

  compose-validation:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    needs: python-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_database
          FERNET_KEY: ci_fernet_key
          SMTP_USER: ci@example.com
          SMTP_PASSWORD: ci_password
        run: |
          docker compose config --quiet
